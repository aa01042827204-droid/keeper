name: Build Helper APK 5
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unpack project and build
        run: |
          echo '' | base64 -d | tar xz
          cd KeeperHelper
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: keeper-helper-apk-5
          path: KeeperHelper/app/build/outputs/apk/debug/app-debug.apk
